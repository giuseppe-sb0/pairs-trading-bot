# =====================================================================
#  Pairs trading forex - regole PRE-REGISTRATE (non modificarle dopo aver
#  visto i risultati: ogni modifica = un nuovo test da contare).
# =====================================================================

timezone: Europe/Rome
universe: [EURUSD, GBPUSD, AUDUSD, NZDUSD, USDCAD, USDCHF, USDJPY, EURGBP, EURCHF]   # 36 accoppiamenti
timeframe: 1h

# Costo round-trip PER GAMBA in pip: spread medio + commissione Razor (~0.6) + slippage (0.3).
# Stime prudenti per Pepperstone Razor fuori dagli orari di rollover: da verificare in demo.
costs_pips:
  EURUSD: 1.0
  GBPUSD: 1.2
  AUDUSD: 1.1
  NZDUSD: 1.3
  USDCAD: 1.3
  USDCHF: 1.3
  USDJPY: 1.1
  EURGBP: 1.3
  EURCHF: 1.5
swap_bps_per_leg_day: 0.5     # costo di mantenimento overnight stimato, per gamba (prudente)
no_entry_hours: [22, 23, 0]   # ora locale: rollover, spread larghi

# Regola di trading (4 varianti = 2 lookback x 2 soglie)
rules:
  lookback_hours: [120, 480]  # finestra della regressione rolling (beta, media e std del residuo)
  z_entry: [2.0, 2.5]         # ingresso quando |z| supera la soglia
  z_exit: 0.0                 # uscita al ritorno alla media
  z_stop_add: 2.0             # stop se |z| >= z_entry + 2
  max_hold_mult: 1.0          # uscita a tempo dopo `lookback` barre

# Selezione delle coppie sul periodo di TRAIN (poi si opera solo sul test successivo)
selection:
  coint_pvalue: 0.05          # Engle-Granger sui log-prezzi H1
  half_life_min: 5            # ore
  half_life_max: 500          # ore

walkforward:
  train_months: 8
  test_months: 2
  step_months: 2

# Due verdetti. t calcolato sui P&L SETTIMANALI (i trade di coppie con valute in comune sono
# correlati: il t per trade sovrastima la significativita'). Soglie tarate su universi
# sintetici: 0 falsi positivi su 30 universi casuali, coppia cointegrata trovata 10/10.
verdict:
  min_trades: 100             # aggregato: tutte le coppie selezionate, per regola (4 test)
  t_min: 2.5
  pair_min_trades: 30         # singola coppia x regola (144 test)
  pair_t_min: 3.4             # Bonferroni: 0.05 / 144 test
